<script>
/* ============ Navbar ============ */
const navbar = document.getElementById('navbar');
const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');

menuBtn.addEventListener('click', () => {
  mobileMenu.classList.toggle('hidden');
  menuBtn.innerHTML = mobileMenu.classList.contains('hidden')
    ? '<i class="fa-solid fa-bars"></i>' : '<i class="fa-solid fa-xmark"></i>';
});
mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  mobileMenu.classList.add('hidden');
  menuBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
}));
window.addEventListener('scroll', () => {
  if (window.scrollY > 30) {
    navbar.classList.add('bg-dark-900/85','backdrop-blur-xl','border-gold/15','shadow-2xl');
  } else {
    navbar.classList.remove('bg-dark-900/85','backdrop-blur-xl','border-gold/15','shadow-2xl');
  }
});

/* ============ Reveal on scroll ============ */
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      // animate progress bars inside
      e.target.querySelectorAll('.units-progress span[data-progress]').forEach(s => {
        s.style.width = s.dataset.progress + '%';
      });
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

/* ============ Counters ============ */
const counterObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target;
    const target = parseFloat(el.dataset.target);
    const decimals = parseInt(el.dataset.decimals || 0);
    const dur = 1600; const start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    counterObserver.unobserve(el);
  });
}, { threshold: 0.5 });
document.querySelectorAll('.counter').forEach(el => counterObserver.observe(el));

/* ============ Hero Countdown ============ */
const countdownTarget = Date.now() + ((2 * 24 + 14) * 3600 + 37 * 60) * 1000;
function pad(n) { return String(n).padStart(2, '0'); }
setInterval(() => {
  let diff = Math.max(0, countdownTarget - Date.now()) / 1000;
  document.getElementById('cd-d').textContent = pad(Math.floor(diff / 86400));
  document.getElementById('cd-h').textContent = pad(Math.floor(diff / 3600) % 24);
  document.getElementById('cd-m').textContent = pad(Math.floor(diff / 60) % 60);
  document.getElementById('cd-s').textContent = pad(Math.floor(diff) % 60);
}, 1000);

/* ============ Project filter ============ */
const filterBtns = document.querySelectorAll('#filterBar .filter-btn');
const cards = document.querySelectorAll('.project-card');
filterBtns.forEach(btn => btn.addEventListener('click', () => {
  filterBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.filter;
  cards.forEach(card => {
    const show = f === 'all' || card.dataset.country === f;
    card.style.transition = 'opacity .35s ease, transform .35s ease';
    if (show) {
      card.style.display = '';
      requestAnimationFrame(() => { card.style.opacity = '1'; card.style.transform = 'scale(1)'; });
    } else {
      card.style.opacity = '0'; card.style.transform = 'scale(.96)';
      setTimeout(() => { if (card.style.opacity === '0') card.style.display = 'none'; }, 320);
    }
  });
}));

/* ============ FAQ ============ */
document.querySelectorAll('.faq-item').forEach(item => {
  item.querySelector('button').addEventListener('click', () => {
    document.querySelectorAll('.faq-item').forEach(o => { if (o !== item) o.classList.remove('open'); });
    item.classList.toggle('open');
  });
});

/* ============ ROI Calculator ============ */
const el = id => document.getElementById(id);
const inPrice = el('inPrice'), inDown = el('inDown'), inLoan = el('inLoan'),
      inYield = el('inYield'), inGrowth = el('inGrowth'), inYears = el('inYears');

const fmt = v => '$' + Math.round(v).toLocaleString('en-US');

function calculate() {
  const P  = +inPrice.value;
  let dp = +inDown.value;               // down %
  let lp = +inLoan.value;               // loan %
  if (dp + lp > 100) lp = 100 - dp;     // never exceed 100%
  const y  = +inYield.value / 100;      // rental yield
  const g  = +inGrowth.value / 100;     // appreciation
  const N  = +inYears.value;

  const D = P * dp / 100;               // down payment amount
  const L = P * lp / 100;               // bank loan
  const inst = P - D - L;               // installments remainder

  const rentYear = P * y;
  const monthly = rentYear / 12;
  const annualTotalPct = (y + g) * 100;
  const roiOnDown = D > 0 ? ((P * (y + g)) / D) * 100 : 0;
  const futureVal = P * Math.pow(1 + g, N);
  const capitalGain = futureVal - P;
  const totalProfit = capitalGain + rentYear * N;

  // labels
  el('priceVal').textContent = fmt(P);
  el('downVal').textContent = dp + '%';
  el('downAmt').textContent = fmt(D);
  el('loanVal').textContent = lp + '%';
  el('loanAmt').textContent = fmt(L);
  el('instAmt').textContent = fmt(inst);
  el('yieldVal').textContent = (+inYield.value).toFixed(1) + '%';
  el('growthVal').textContent = (+inGrowth.value).toFixed(1) + '%';
  el('yearsVal').textContent = N + (N === 1 ? ' سنة' : ' سنوات');

  // outputs
  el('outMonthly').textContent = fmt(monthly);
  el('outAnnual').textContent = annualTotalPct.toFixed(1) + '%';
  el('outROI').textContent = roiOnDown.toFixed(0) + '%';
  el('outFutureVal').textContent = fmt(futureVal);
  el('outTotalProfit').textContent = '+' + fmt(totalProfit);
  el('outYearsLabel').textContent = 'خلال ' + N + ' سنوات';

  // chart
  const chart = el('roiChart');
  chart.innerHTML = '';
  const finals = [];
  for (let i = 1; i <= N; i++) {
    finals.push(P * (Math.pow(1 + g, i) - 1) + rentYear * i);
  }
  const max = finals[N - 1];
  for (let i = 1; i <= N; i++) {
    const v = finals[i - 1];
    const col = document.createElement('div');
    col.className = 'flex-1 flex flex-col items-center justify-end h-full gap-1.5 min-w-0';
    col.title = 'السنة ' + i + ': ' + fmt(v);
    const bar = document.createElement('div');
    bar.className = 'roi-bar w-full' + (i === N ? ' final' : '');
    bar.style.height = '0%';
    const lbl = document.createElement('div');
    lbl.className = 'text-[9px] text-slate-500 shrink-0';
    lbl.textContent = i;
    col.appendChild(bar); col.appendChild(lbl);
    chart.appendChild(col);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.height = Math.max(2, (v / max) * 100) + '%';
    }));
  }
}
[inPrice, inDown, inLoan, inYield, inGrowth, inYears].forEach(i => i.addEventListener('input', () => {
  document.querySelectorAll('#presets .filter-btn').forEach(b => b.classList.remove('active'));
  calculate();
}));

// Country presets
document.querySelectorAll('#presets .filter-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#presets .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  inYield.value = btn.dataset.yield;
  inGrowth.value = btn.dataset.growth;
  calculate();
}));
calculate();

/* ============ Live purchase toasts ============ */
const toasts = [
  { i: 'fa-house-circle-check', n: 'محمد من الرياض',   t: 'حجز وحدة في «باتومي سي تاون» قبل دقيقتين' },
  { i: 'fa-money-bill-transfer', n: 'سارة من دبي',     t: 'استلمت عائدها الشهري المضمون لشهر هذا' },
  { i: 'fa-file-signature',      n: 'أحمد من الكويت',  t: 'وقّع عقد إدارة مؤجرة مضمونة لمدة 10 سنوات' },
  { i: 'fa-building-columns',    n: 'نورة من قطر',     t: 'حصلت على تمويل بنكي 60% لشقتها في باكو' },
  { i: 'fa-key',                 n: 'خالد من عمّان',   t: 'استلم مفاتيح شقته في تبليسي هايتس' },
  { i: 'fa-chart-line',          n: 'ليلى من مسقط',    t: 'باعت وحدة في إسطنبول بربح 34% بعد سنتين' },
];
const toastBox = el('liveToast');
let toastIdx = 0;
function showToast() {
  const d = toasts[toastIdx % toasts.length];
  toastIdx++;
  el('toastIcon').innerHTML = '<i class="fa-solid ' + d.i + '"></i>';
  el('toastName').textContent = d.n;
  el('toastText').textContent = d.t;
  toastBox.classList.add('show');
  setTimeout(() => toastBox.classList.remove('show'), 5200);
}
setTimeout(showToast, 4000);
setInterval(showToast, 13000);

/* ============ Lead form ============ */
el('leadForm').addEventListener('submit', e => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> تم الحجز بنجاح! سنتواصل معك قريباً';
  btn.disabled = true;
  btn.style.opacity = '.85';
  showToast('form');
  el('toastIcon').innerHTML = '<i class="fa-solid fa-champagne-glasses"></i>';
  el('toastName').textContent = 'طلبك وصل إلينا';
  el('toastText').textContent = 'سيتواصل معك مستشارك الاستثماري خلال أقل من ساعة';
  toastBox.classList.add('show');
  setTimeout(() => toastBox.classList.remove('show'), 6000);
  setTimeout(() => { e.target.reset(); btn.disabled = false; btn.style.opacity = '1';
    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> احجز استشارتي المجانية الآن'; }, 5000);
});
</script>
