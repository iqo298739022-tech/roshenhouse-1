<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
:root {
  --gold: #c9a84c;
  --gold-light: #f3d77e;
  --gold-bright: #ffe68d;
  --dark-base: #080709;
  --dark-card: #120f16;
  --line-gold: rgba(201, 168, 76, 0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Tajawal', sans-serif;
  background-color: var(--dark-base);
  color: #f7f4ed;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201, 168, 76, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 90% 60%, rgba(142, 102, 23, 0.08), transparent);
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0b090e; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c9a84c, #705419); border-radius: 999px; }

/* Golden Gradient Text */
.text-gold-gradient {
  background: linear-gradient(135deg, #FFF0B8 0%, #D8B153 50%, #A67D28 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.gold-button-gradient {
  background: linear-gradient(135deg, #d8b252 0%, #ba8e2f 100%);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  color: #0b0906;
}
.gold-button-gradient:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(201, 168, 76, 0.45);
  background: linear-gradient(135deg, #ecd178 0%, #cfa33e 100%);
}

/* ===== Flash & Beacon (تضوي وتطفي) ===== */
@keyframes urgentBeacon {
  0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.85); opacity: 1; }
  50%  { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); opacity: 0.8; }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); opacity: 1; }
}
@keyframes emergencyFlash {
  0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #ef4444); }
  50%      { opacity: 0.35; filter: drop-shadow(0 0 0px transparent); }
}
.urgency-badge {
  background: linear-gradient(135deg, rgba(220, 38, 38, 0.95), rgba(153, 27, 27, 0.95));
  border: 1px solid rgba(254, 202, 202, 0.4);
  animation: urgentBeacon 2s infinite ease-in-out;
}
.text-flash { animation: emergencyFlash 1.2s infinite; }

/* Glassmorphism */
.glass-card {
  background: rgba(18, 15, 22, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(201, 168, 76, 0.15);
  transition: all 0.35s ease;
}
.glass-card:hover {
  border-color: rgba(201, 168, 76, 0.45);
  transform: translateY(-5px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(201, 168, 76, 0.15);
}

/* Toast */
.toast-bubble {
  transform: translateY(120px); opacity: 0;
  transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast-bubble.show { transform: translateY(0); opacity: 1; }

/* Range Slider */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
  background: #d8b252; cursor: pointer; box-shadow: 0 0 10px rgba(216, 178, 82, 0.8);
  border: 2px solid #ffffff; margin-top: -8px;
}
input[type=range]::-moz-range-thumb {
  height: 20px; width: 20px; border-radius: 50%; background: #d8b252; cursor: pointer;
  box-shadow: 0 0 10px rgba(216, 178, 82, 0.8); border: 2px solid #fff;
}
input[type=range]::-webkit-slider-runnable-track {
  width: 100%; height: 6px; cursor: pointer; background: #2b2533; border-radius: 6px; border: none;
}
input[type=range]::-moz-range-track { width: 100%; height: 6px; background: #2b2533; border-radius: 6px; }

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(34px); transition: opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }

.section-eyebrow {
  display: inline-flex; align-items: center; gap: .6rem; font-size: .8rem; letter-spacing: .2em;
  color: var(--gold); border: 1px solid var(--line-gold); border-radius: 999px;
  padding: .35rem 1rem; background: rgba(201,168,76,.06);
}
.gold-divider {
  width: 90px; height: 2px; margin: 0 auto;
  background: linear-gradient(90deg, transparent, #c9a84c, transparent); position: relative;
}
.gold-divider::after {
  content: '\f005'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: #080709; color: #c9a84c; padding: 0 10px; font-size: .6rem;
}

/* Hero orbs */
@keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
.float-slow { animation: floatY 5s ease-in-out infinite; }
.float-slower { animation: floatY 7s ease-in-out infinite; }
.orb { position:absolute; border-radius:50%; filter: blur(70px); opacity:.5; pointer-events:none; }
.hero-grid-lines {
  background-image: linear-gradient(rgba(201,168,76,.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(201,168,76,.05) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 75%);
}

/* Units progress */
.units-progress { height: 8px; border-radius: 999px; background: #241f2c; overflow: hidden; }
.units-progress span {
  display: block; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, #8a6a20, #d8b252, #f3d77e);
  transition: width 1.4s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 0 12px rgba(201,168,76,.5);
}
.units-progress.danger span {
  background: linear-gradient(90deg, #7f1d1d, #ef4444, #f87171);
  box-shadow: 0 0 12px rgba(239,68,68,.55);
}

/* Countdown */
.count-box {
  min-width: 74px; padding: .7rem .5rem; text-align: center;
  background: rgba(18,15,22,.85); border: 1px solid var(--line-gold); border-radius: 14px;
}
.count-num { font-size: 1.6rem; font-weight: 900; color: #ffe9ad; text-shadow: 0 0 18px rgba(201,168,76,.55); }

/* Filter buttons */
.filter-btn { transition: all .3s ease; border:1px solid rgba(201,168,76,.25); color:#cbbfa4; }
.filter-btn.active, .filter-btn:hover {
  background: linear-gradient(135deg,#d8b252,#ba8e2f); color:#0b0906;
  border-color: transparent; box-shadow: 0 8px 22px rgba(201,168,76,.35);
}

/* Steps */
.step-line { position: absolute; top: 34px; right: 60px; left: 60px; height: 2px;
  background: linear-gradient(90deg, rgba(201,168,76,.05), rgba(201,168,76,.5), rgba(201,168,76,.05)); }

/* FAQ */
.faq-item .faq-answer { max-height: 0; overflow: hidden; transition: max-height .5s cubic-bezier(.16,1,.3,1); }
.faq-item.open .faq-answer { max-height: 400px; }
.faq-item.open .faq-chevron { transform: rotate(180deg); }
.faq-chevron { transition: transform .4s ease; }

/* Marquee */
@keyframes tickerMove { from { transform: translateX(0); } to { transform: translateX(50%); } }
.ticker-track { display:flex; gap:3rem; width:max-content; animation: tickerMove 30s linear infinite; }

/* Payment structure bar */
.pay-seg { transition: width 1.6s cubic-bezier(.16,1,.3,1); }

/* ROI chart bars */
.roi-bar { transition: height .9s cubic-bezier(.16,1,.3,1); background: linear-gradient(180deg,#f3d77e,#8a6a20); border-radius: 6px 6px 0 0; box-shadow: 0 0 10px rgba(201,168,76,.25); min-height: 4px; }
.roi-bar.final { background: linear-gradient(180deg,#ffe9ad,#ba8e2f); box-shadow: 0 0 16px rgba(201,168,76,.5); }

@media (max-width: 767px) { .step-line { display: none; } }
</style>
</head>

